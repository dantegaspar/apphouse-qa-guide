# Despliegue de AppHouse QA Guide con Docker Compose.
# Uso: cp .env.example .env  (y define ADMIN_PASSWORD)  ->  docker compose up -d --build
#
# DATOS PERSISTENTES: todo se guarda en una carpeta normal del servidor (por defecto
# ./qa-data junto a este archivo; cámbiala con QA_DATA_PATH en .env). Como no son
# volúmenes de Docker, NINGÚN comando de Docker los borra: ni "docker compose down -v",
# ni "docker volume prune", ni "docker system prune -a --volumes", ni reconstruir la imagen.
#   qa-data/data      base SQLite (qa.sqlite)
#   qa-data/uploads   fotos y videos de los reportes
#   qa-data/backups   respaldos automáticos de la base cada 10 min (se guardan las últimas 24 h)
#
# IMPORTANTE: la base de datos es SQLite (archivo local con modo WAL).
# Solo puede haber UNA instancia (réplica) del servicio: no escales a varias
# réplicas ni las pongas en varias máquinas, porque se corromperían los datos.

services:
  app:
    build: .
    image: apphouse-qa-guide
    # Puerto del host: toma PORT de .env (por defecto 3000). El contenedor siempre escucha en 3000.
    ports:
      - "${PORT:-3000}:3000"
    # .env es opcional: si no existe, Compose sigue funcionando con las variables del entorno.
    env_file:
      - path: .env
        required: false
    environment:
      # Estas variables se toman del .env o del entorno del shell.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      GUIDE_PASSWORD: "${GUIDE_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-15}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Fijadas dentro del contenedor: no las cambies aquí, porque deben coincidir con los volúmenes
      # y con el puerto interno. Anulan cualquier valor distinto que venga de .env.
      PORT: "3000"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      BACKUP_EVERY_MIN: "${BACKUP_EVERY_MIN:-10}"
      BACKUP_KEEP: "${BACKUP_KEEP:-144}"
    volumes:
      # Carpetas del servidor (bind mounts), no volúmenes de Docker.
      - type: bind
        source: ${QA_DATA_PATH:-./qa-data}/data
        target: /app/data
        bind: { create_host_path: true }
      - type: bind
        source: ${QA_DATA_PATH:-./qa-data}/uploads
        target: /app/uploads
        bind: { create_host_path: true }
      - type: bind
        source: ${QA_DATA_PATH:-./qa-data}/backups
        target: /app/backups
        bind: { create_host_path: true }
    restart: unless-stopped
